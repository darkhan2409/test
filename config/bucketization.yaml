# Бакетизация числовых полей — §19.
#
# Границы считаются на BUILD по TRAIN и замораживаются: Validation, Test и
# production применяют их как есть (§19). Поэтому здесь задаётся только
# **как считать**, а не сами границы — они появляются артефактом BUILD.
#
# §19.2 называет стартовые варианты числа бакетов: 16, 32, 64, 128. Окончательный
# выбор делается по Validation, которого на этом этапе нет, поэтому значения
# ниже — обоснованные стартовые, а не подобранные.
#
# Метод задаётся по полю (§19.2). Реализованы `quantile` и `equal_width`:
# оба считаются из данных и ничего не выдумывают. `log_space` и
# `business_defined` из §19.2 не реализованы — см. «Отложено» в PLAN.md.

bucket_edges_version: "1.0.0"

defaults:
  method: quantile
  bucket_count: 32

fields:

  amount_base_bucket:
    # Суммы распределены лог-нормально: равные по ширине бакеты собрали бы
    # 90% транзакций в первый. Квантили дают равнонаполненные корзины.
    # Бакетов больше обычного — по этому полю проходит основной сигнал.
    method: quantile
    bucket_count: 64

  salary_bucket:
    method: quantile
    bucket_count: 32

  duration_bucket:
    method: quantile
    bucket_count: 32

  screens_count_bucket:
    # Значений мало и они целые, поэтому часть квантильных границ совпадёт.
    # Это ожидаемо: §19.3 удаляет дубли и фиксирует фактическое число бакетов.
    method: quantile
    bucket_count: 32

  age_bucket:
    # Возраст ограничен business range (14..120) и читается человеком:
    # равные по ширине интервалы здесь понятнее квантильных.
    method: equal_width
    bucket_count: 16

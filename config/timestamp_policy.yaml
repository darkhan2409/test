# Политика времени и часовых поясов — §12, §12.1, §12.2.
#
# Две версии, а не одна: §30 перечисляет `timestamp_policy_version` и
# `calendar_timezone_policy_version` раздельно. Разбор времени и выбор
# календарной зоны меняются независимо, и версия должна двигаться у того,
# что изменилось.

timestamp_policy_version: "1.0.0"
calendar_timezone_policy_version: "1.0.0"

# §12 п.9 требует помечать событие «из будущего» относительно clock-skew
# policy, но самой policy не задаёт (допущение A8).
#
# Отсчёт от cutoff T, а не от текущего времени: результат обработки не может
# зависеть от того, когда запустили прогон — §29 требует воспроизводимости.
# 90 дней — заведомо больше нормального окна поступления данных (самая
# терпимая допустимая задержка в контрактах — 168 часов) и заведомо меньше
# явной ошибки часов.
future_horizon_days: 90

# Справочники «значение поля → IANA-зона». Контракт ссылается на справочник
# по имени (`timezone.mapping`), а таблица живёт здесь: одна и та же таблица
# может обслуживать несколько источников.
#
# Зоны именно IANA, а не смещения: §12.1 запрещает применять нынешний UTC+05
# ретроактивно, а исторические правила помнит только IANA.
timezone_mappings:
  region_timezone:
    # Значения совпадают с регионами профиля и филиалами core_payments —
    # один справочник обслуживает оба.
    ALMATY: Asia/Almaty
    ASTANA: Asia/Almaty
    SHYMKENT: Asia/Almaty
    KOSTANAY: Asia/Qostanay
    AKTOBE: Asia/Aqtobe
    ATYRAU: Asia/Atyrau
    ORAL: Asia/Oral

# Откуда берётся зона клиента для источников с политикой
# `client_profile_region` (карточный процессинг, логи приложения). Объявлено
# явно, а не выведено из имён полей: догадка «поле называется region, значит
# это регион клиента» сломается на первом источнике с другим неймингом.
client_profile_region:
  source: profile_snapshots
  field: region
  mapping: region_timezone

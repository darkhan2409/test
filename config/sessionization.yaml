# Sessionization app-логов — §20.
#
# §20.3 требует версионировать конфиг сессионизации: изменение правил меняет
# состав и границы сессий, а значит и все признаки, которые из них считаются.
#
# `session_gap` живёт не здесь, а в `core/settings.py`: §20.1 объявляет его
# конфигурацией прогона, и он входит в `preprocessing_state_sha256` вместе с
# остальной доменной политикой.

sessionization_version: "1.0.0"

# Источник app-логов и его поля.
source: app_logs
action_field: action
screen_field: screen

# Явные границы сессии (§20.1). LOGIN начинает новую сессию, даже если
# предыдущая формально не истекла: вход в приложение — это новая сессия
# по смыслу, а не продолжение старой.
session_start_actions:
  - LOGIN

# Действия, которые входят в сессию. Всё, что сюда не попало и не является
# отдельным событием, в сессию не собирается: список закрыт, чтобы новое
# действие в логах не растворилось молча в чужой сессии.
session_actions:
  - LOGIN
  - screen_open
  - button_click
  - form_submit

# Поля APP_SESSION (§20.2). Бакетизация длительности и числа экранов —
# работа §19; здесь готовятся сырые значения под неё, поэтому в именах нет
# суффикса `_bucket`.
#
# `top_intent` не считается: он требует утверждённого справочника
# «экран → намерение», которого в этих логах нет. Придумывать его здесь
# значило бы выдать догадку за бизнес-классификацию.
device_category_field: platform
app_version_field: app_version

# Порог «неправдоподобно длинной» сессии для `session_anomaly_rate` (§33.13).
# Регламент называет аномалию, но не даёт значения. 12 часов — заведомо
# больше любого разумного сеанса в банковском приложении и заведомо меньше
# суток, за которые разрыв в 30 минут точно случился бы.
max_session_duration_hours: 12

# Политика дедупликации — §9.
#
# Ключ точного дубля (§9.1) задан регламентом и в конфиге не настраивается:
# source system + source record ID + payload version. Настраивается здесь
# только бизнес-отпечаток (§9.2), потому что «один и тот же факт» у каждого
# источника выражается своими полями.
#
# Отпечаток версионируется вместе со всей политикой: изменение состава полей
# меняет, какие записи считаются одним фактом, а значит и результат обработки.
#
# `business_fingerprint: null` — осознанно выключенная бизнес-дедупликация,
# а не забытая настройка. Ключ обязателен у каждого источника: молчание тут
# читалось бы как «наверное, не нужно».
#
# Ограничение: отпечаток считается **внутри источника**. Межисточниковый
# бизнес-дубль (одна покупка в карточном процессинге и в ядре платежей) на
# этом шаге неразличим: суммы ещё сырые — строка «33 000,00» в одном
# источнике и целое 3300000 тиын в другом, — а FX-нормализация (§18) идёт
# позже по цепочке §37.2.

dedup_policy_version: "1.0.0"

sources:

  core_payments:
    # Набор полей из примера §9.2: клиент, время, сумма, валюта, направление,
    # ссылка на контрагента.
    business_fingerprint:
      - client_id
      - event_time
      - amount
      - currency
      - direction
      - counterparty_ref

  card_processing:
    business_fingerprint:
      - client_id
      - event_time
      - amount_minor
      - currency_code
      - merchant_id

  app_logs:
    # Выключено осознанно: два одинаковых касания экрана в одну секунду —
    # правдоподобное поведение пользователя, а не дубль выгрузки. Схлопнуть
    # их значило бы подделать поведение, которое §20 потом измеряет.
    business_fingerprint: null

  profile_snapshots:
    # Первичный ключ (cif, snapshot_date) уже описывает факт целиком:
    # два снимка одного клиента за одну дату — это точный дубль (§9.1).
    business_fingerprint: null

  fx_rates:
    # То же: ключ (rate_date, currency) и есть бизнес-факт.
    business_fingerprint: null

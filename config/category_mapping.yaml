# Нормализация категорий — §16.
#
# Порядок операций фиксирован и одинаков для всех полей: trim → Unicode NFKC →
# регистр → alias mapping. Порядок важен: alias-таблица ищется уже по
# приведённому значению, иначе в неё пришлось бы вносить каждое написание
# в каждом регистре.
#
# `on_violation` действует только на closed-set поля (§16.1) и допускает ровно
# два исхода регламента: `missing` или `schema_violation`. Третьего — «завести
# новую категорию» — нет ни в регламенте, ни здесь.
#
# Open-set поля (§16.2) нормализуются и остаются как есть: решение RARE/[UNK]
# принимает токенайзер после заморозки словаря, а не препроцессинг.

category_mapping_version: "1.0.0"

# Правила по умолчанию для всех категориальных полей.
defaults:
  trim: true
  unicode: NFKC
  case: upper
  on_violation: missing

fields:

  currency:
    # Только то, что действительно требует перевода: написание словом и
    # ISO-4217 numeric. Сам код `KZT` после приведения регистра уже
    # канонический, и строка `KZT: KZT` лишь мешала бы отличать в отчёте
    # реальные срабатывания справочника от совпадений с самим собой.
    # Пример прямо из §16: "kzt", "тенге", "398" → "KZT".
    aliases:
      ТЕНГЕ: KZT
      TENGE: KZT
      "398": KZT
      ДОЛЛАР: USD
      DOLLAR: USD
      "840": USD
      ЕВРО: EUR
      EURO: EUR
      "978": EUR

  direction:
    aliases:
      # Направление встречается и словами.
      ВХОДЯЩИЙ: IN
      ИСХОДЯЩИЙ: OUT

  terminal_country:
    # Alias-таблицы нет: страна приходит кодом ISO-3166 alpha-2.
    aliases: {}

  block_reason:
    aliases: {}

  region:
    aliases: {}

  employment:
    aliases: {}

  device_category:
    aliases: {}

  # Open-set поля: регистр и форма приводятся, значения не ограничиваются.
  merchant_category:
    aliases: {}
  template_id:
    aliases: {}
  first_screen:
    aliases: {}
  last_screen:
    aliases: {}
  screens:
    aliases: {}
  products:
    aliases: {}
  # Версия приложения — не категория в смысле смысла, но и не число.
  # Регистр приводится, чтобы `6.0.1` и `6.0.1 ` не разошлись.
  app_version:
    aliases: {}

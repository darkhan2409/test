# Identity mapping — §7.
#
# Здесь только политика. Сама таблица соответствий («ссылка источника →
# client_id») лежит отдельным файлом: у неё 200 клиентов × 4 источника, и
# держать восемьсот строк в конфиге, который читают глазами, бессмысленно.
#
# На синтетическом этапе таблицу выпускает генератор. В бою на её месте будет
# версионированная выгрузка identity-системы — имя файла меняется, формат нет.
#
# Секции таблицы называются `<источник>.<client_field>` и выводятся из Source
# Contract, а не перечисляются здесь: дублировать имя поля клиента в двух
# конфигах — верный способ их рассинхронизировать.

identity_mapping_version: "1.0.0"

# Имя файла внутри `_meta/` обрабатываемого набора — без каталога, и каталог
# здесь не примут. Таблица клиентов принадлежит набору, а не рабочему каталогу:
# путь вида `data/raw/_meta/...` заставлял прогон над любым набором читать
# таблицу основного, то есть подставлял файл с конкретной машины.
table_file: identity_mapping.json

# §7 п.4: публичный идентификатор модели не должен быть PII. Канонический
# client_id обязан быть непрозрачным — шаблон это и проверяет.
client_id_pattern: "^C[0-9]{6}$"

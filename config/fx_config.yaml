# FX-нормализация — §18, §18.1, §18.2.
#
# `fx_max_staleness_days` здесь **не** задаётся: это доменная политика прогона,
# она живёт в `core/settings.py` и входит в `preprocessing_state_sha256` (§30)
# вместе с cutoff и global_seed. Здесь только описание источника курсов.
#
# Курс всегда исторический: берётся тот, что действовал на момент события,
# а не сегодняшний. Иначе транзакция 2023 года пересчиталась бы по курсу
# 2026-го, и сумма в тенге зависела бы от даты запуска пайплайна.

fx_normalization_version: "1.0.0"

# Базовая валюта. Суммы в ней не конвертируются вовсе (§18).
base_currency: KZT

# Источник курсов (§18.1): утверждён, версионирован, исторически воспроизводим,
# доступен по дате, имеет lineage.
source: fx_rates
rate_date_field: rate_date
currency_field: currency
rate_field: rate_to_kzt
rate_source_field: source

# Кто вправе публиковать курс. Строка от другого поставщика — не «ещё один
# курс», а неутверждённый источник, и в таблицу она не попадает.
approved_rate_sources:
  - NBK

# Delta-канал — §25.2, §27 шаг 13.
#
# Отдельный конфиг, а не секция `bucketization.yaml`: §25.2 требует держать
# бакетизацию дельт и бакетизацию числовых полей события разными компонентами.
# У них разные версии, разные артефакты и разный момент применения — границы
# полей применяет препроцессинг, границы дельты токенайзер после truncation.
#
# Метод только `quantile`: дельты между событиями распределены с тяжёлым
# хвостом (минуты у активного клиента, месяцы у спящего), и равная ширина
# сложила бы почти всё в первый бакет. Других методов в `DeltaMethod` нет.

time_delta_edges_version: "1.0.0"

method: quantile

# 32 — то же умолчание, что у полей события (допущение A3 плана). Фактическое
# число бакетов может оказаться меньше: §19.3 удаляет совпавшие границы, и на
# дельтах это вероятнее, чем на суммах — секунды дискретны.
bucket_count: 32

# Размер выборки дельт. Отдельно от `bucket_sample_size` настроек: дельт
# примерно столько же, сколько событий, но выборка у них своя — общий размер
# связал бы два независимых артефакта одним числом.
sample_size: 50000
